<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Personajes
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Personajes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-grid class="characters-grid">
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let character of characters">
        <ion-card class="character-card" [class.favorite]="isFavorite(character)">
          <ion-button
            fill="clear"
            size="small"
            class="favorite-button"
            [color]="isFavorite(character) ? 'danger' : 'medium'"
            (click)="toggleFavorite(character); $event.stopPropagation();"
            aria-label="{{ isFavorite(character) ? 'Eliminar de favoritos' : 'Agregar a favoritos' }}"
          >
            <ion-icon [name]="isFavorite(character) ? 'heart' : 'heart-outline'"></ion-icon>
          </ion-button>
          <div class="character-image-container">
            <img [src]="getImageUrl(character.portrait_path)" [alt]="character.name" class="character-image">
          </div>
          <ion-card-header>
            <ion-card-subtitle>{{ character.status }}</ion-card-subtitle>
            <ion-card-title>{{ character.name }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p class="occupation">{{ character.occupation }}</p>
            <ion-chip color="warning" class="simpsons-chip">
              <ion-icon name="star" color="dark"></ion-icon>
              <ion-label>¡Ay caramba!</ion-label>
            </ion-chip>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Cargando más personajes...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <div *ngIf="loading && characters.length === 0" class="ion-text-center ion-padding">
    <ion-spinner></ion-spinner>
  </div>
</ion-content>
