<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Buscar
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Buscar</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="onSearchChange($event)" (ionClear)="clearSearch()"
    placeholder="Buscar personaje..." showClearButton="always">
  </ion-searchbar>


  <div *ngIf="loading" class="loading-container">
    <div class="donut-spinner"></div>
    <p>Cargando...</p>
  </div>

  <ion-list *ngIf="!loading && characters.length > 0">
    <ion-item *ngFor="let character of characters">
      <ion-avatar slot="start">
        <img [src]="getImageUrl(character.portrait_path)" [alt]="character.name">
      </ion-avatar>
      <ion-label>
        <h2>{{ character.name }}</h2>
        <p>{{ character.occupation }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="!loading && searched && characters.length === 0" class="ion-text-center ion-padding">
    <ion-icon name="search-outline" style="font-size: 64px; color: #ccc;"></ion-icon>
    <p>No se encontraron personajes</p>
  </div>

  <div *ngIf="!loading && !searched" class="ion-text-center ion-padding" style="margin-top: 50%;">
    <ion-icon name="search" style="font-size: 64px; color: #ccc;"></ion-icon>
    <p>Busca tu personaje favorito de Los Simpson</p>
  </div>
</ion-content>
